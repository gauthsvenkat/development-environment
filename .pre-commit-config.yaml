ci:
    skip:
        - hadolint-docker

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
    -   id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL4006]
